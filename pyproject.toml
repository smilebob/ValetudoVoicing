[project]
name = "valetudo-voicing"
version = "0.1.0"
description = "100% local CLI & ncurses TUI to clone voices from YouTube, record your own voice, apply 23+ fun audio effects, and deploy Roborock S5 Valetudo voicepacks."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "smilebob" }]
keywords = [
    "valetudo",
    "roborock",
    "roborock-s5",
    "voicepack",
    "voice-cloning",
    "tts",
    "xtts-v2",
    "ncurses",
    "tui",
    "smart-home",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "yt-dlp>=2024.10.0",
    "httpx>=0.27.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0,<2.1.0",
    "scipy>=1.11.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "coqui-tts>=0.24.0",
    "six>=1.16.0",
]

[project.optional-dependencies]
isolate = [
    "demucs>=4.0.0",
]
chatterbox = [
    "chatterbox-tts>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
valetudo-voicing = "valetudo_voicing.cli:app"
valetudo-voicing-tui = "valetudo_voicing.tui:run_tui"

[project.urls]
Homepage = "https://github.com/smilebob/ValetudoVoicing"
Repository = "https://github.com/smilebob/ValetudoVoicing"
Issues = "https://github.com/smilebob/ValetudoVoicing/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valetudo_voicing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
